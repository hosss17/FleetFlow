# ==========================================
# DATABASE CONFIGURATION
# ==========================================
server.port=8081
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:mysql://localhost:3306/mission_db?createDatabaseIfNotExist=true&serverTimezone=UTC}
spring.datasource.username=root
spring.datasource.password=${DB_PASSWORD:root}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.properties.hibernate.format_sql=true

# ==========================================
# SERVER CONFIGURATION
# ==========================================

spring.application.name=Projet

spring.security.user.name=admin
spring.security.user.password=admin123

# JWT Configuration
app.jwt.secret=${JWT_SECRET:SecretKeyForAttijariBankManagingSystem20262026}
# 24h in milliseconds
app.jwt.expiration=86400000 
# 7 days in milliseconds
app.jwt.refresh-expiration=604800000
app.jwt.n8n-expiration=31536000000 


